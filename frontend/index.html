<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb - Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="feed-page">
    <nav class="navbar">
        <div class="logo">DevWeb</div>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar proyectos o servicios...">
        <div class="user-menu">
            <a href="users/profile.html" id="userName" class="user-link"></a>
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </nav>

    <!-- Banner para FREELANCER -->
    <div class="post-banner" id="freelancerBanner" style="display:none;">
        <p>¿Qué estás trabajando?</p>
        <button onclick="abrirModal('modalProyecto')">Subir proyecto</button>
    </div>

    <!-- Banner para CLIENT -->
    <div class="post-banner" id="clientBanner" style="display:none;">
        <p>¿Eres freelancer? Únite a DevWeb</p>
        <button onclick="abrirModal('modalFreelancer')">Convertirme en freelancer</button>
    </div>

    <!-- Modal: Crear proyecto -->
    <div class="modal-overlay" id="modalProyecto" style="display:none;">
        <div class="modal-box">
            <h3>Subir nuevo proyecto</h3>
            <form id="formProyecto">
                <input type="text" id="projTitle" placeholder="Título" required>
                <textarea id="projDescription" placeholder="Descripción" required></textarea>
                <select id="projCategory" required>
                    <option value="">Categoría</option>
                    <option value="WEB_DEVELOPMENT">Desarrollo Web</option>
                    <option value="MOBILE_DEVELOPMENT">Desarrollo Móvil</option>
                    <option value="GRAPHIC_DESIGN">Diseño Gráfico</option>
                    <option value="UI_UX_DESIGN">UI/UX</option>
                </select>
                <input type="url" id="projImage" placeholder="URL de imagen" required>
                <div class="modal-buttons">
                    <button type="button" onclick="cerrarModal('modalProyecto')">Cancelar</button>
                    <button type="submit">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Convertirse en freelancer -->
    <div class="modal-overlay" id="modalFreelancer" style="display:none;">
        <div class="modal-box">
            <h3>Convertirte en freelancer</h3>
            <p>Al confirmar, tu cuenta podrá publicar servicios y proyectos.</p>
            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalFreelancer')">Cancelar</button>
                <button onclick="confirmarFreelancer()">Confirmar</button>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="modalSolicitud" style="display:none;">
        <div class="modal-box">
            <h3>Solicitar servicio</h3>

            <p id="requestServiceTitle"></p>

            <input type="hidden" id="requestServiceId">
            <input type="hidden" id="requestFreelancerId">

            <textarea id="requestDescription" placeholder="Describe el trabajo que necesitás"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalSolicitud')">Cancelar</button>
                <button type="button" onclick="sendJobRequest()">Enviar solicitud</button>
            </div>
        </div>
    </div>

    <div id="reportModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h4 id="reportTitle">Reportar Proyecto</h4>

            <select id="reportType">
                <option value="">Selecciona el motivo</option>
                <option value="SPAM">Spam</option>
                <option value="INAPPROPRIATE_CONTENT">Contenido inapropiado</option>
                <option value="MISLEADING_INFORMATION">Publicidad engañosa</option>
                <option value="HARASSMENT">Insultos / Acoso</option>
                <option value="HATE_SPEECH">Discurso de odio</option>
                <option value="SCAM_OR_FRAUD">Intento de estafa</option>
                <option value="COPYRIGHT_VIOLATION">Violación de derechos de autor</option>
                <option value="IMPERSONATION">Credenciales falsas</option>
                <option value="ILLEGAL_CONTENT">Contenido ilegal</option>
                <option value="OTHER">Otro</option>
            </select>

            <input type="hidden" id="reportProjectId">

            <textarea id="reportText" placeholder="Motivo del reporte"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('reportModal')">Cancelar</button>
                <button onclick="sendReport()">Enviar reporte</button>
            </div>

        </div>
    </div>

    <div class="feed-container" id="feedContainer">
        <!-- Aquí se cargan los proyectos dinámicamente -->
    </div>

    <script src="js/api.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        let allProyectos = [];
        let allServicios = [];
        let reportMode = "PROJECT";

        if (!user) {
            window.location.href = "users/login.html";
        }

        document.getElementById("userName").textContent = "Hola, " + user.name;

        async function cargarProyectos() {
            const response = await fetch(API_URL + "/projects");
            const proyectos = await response.json();

            allProyectos = proyectos;

            const contenedor = document.getElementById("feedContainer");
            contenedor.innerHTML = "";

            proyectos.forEach(proyecto => {
                contenedor.innerHTML += `
                    <div class="project-card">
                        <img src="${proyecto.imageUrl}" class="project-image" alt="${proyecto.title}">
                            <div class="project-info">
                                <h3>${proyecto.title}</h3>
                                <p class="service-owner">
                                    Por:
                                    <a href="freelancer.html?id=${proyecto.freelancerId}">
                                      ${proyecto.freelancerName}
                                    </a>
                                </p>

                                <p>${proyecto.description || ""}</p>
                                <p>Categoría: ${proyecto.category || ""}</p>
                                <button class="btn-report" onclick="openReportModal(${proyecto.id})" >
                                    Reportar Proyecto
                                </button>
                            </div>
                    </div>
                `;
            });
        }

        async function cargarServicios() {
            const response = await fetch(API_URL + "/api/services/findAll");

            if (!response.ok) {
                return;
            }

            const servicios = await response.json();

            allServicios = servicios;

            const contenedor = document.getElementById("feedContainer");

            servicios.forEach(service => {
                contenedor.innerHTML += `
                    <div class="project-card" >
                        <img src="${service.imageUrl}" class="project-image" alt="${service.title}">

                            <div class="project-info">
                                <h3>${service.title}</h3>

                                <p>Categoría: ${service.category}</p>
                                <p>${service.description || ""}</p>
                                <p>Precio: ₡${Number(service.price).toLocaleString()}</p>

                                <div class="service-footer">

                                    <div class="service-owner">
                                        Por:
                                        <a href="freelancer.html?id=${service.freelancerId}">
                                            ${service.freelancerName}
                                        </a>
                                    </div>

                                    <div class="card-actions">
                                        <button
                                            class="btn-service"
                                            onclick="openRequestModal(${service.id}, ${service.freelancerId}, '${service.title.replace(/'/g, "\\'")}')">
                                            Solicitar servicio
                                        </button>

                                        <button
                                            class="btn-report"
                                            onclick="openReportServiceModal(${service.id})">
                                            Reportar servicio
                                        </button>
                                    </div>

                            </div>
                        </div>
            </div >
        `;
            });
        }

        if (user.role === "FREELANCER") {
            document.getElementById("freelancerBanner").style.display = "flex";
        } else if (user.role === "CLIENT") {
            document.getElementById("clientBanner").style.display = "flex";
        }

        document.getElementById("formProyecto").addEventListener("submit", async function (e) {
            e.preventDefault();

            const proyecto = {
                title: document.getElementById("projTitle").value,
                description: document.getElementById("projDescription").value,
                category: document.getElementById("projCategory").value,
                imageUrl: document.getElementById("projImage").value,
                freelancer: { id: user.id }
            };

            const response = await fetch(API_URL + "/projects", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(proyecto)
            });

            if (response.ok) {
                cerrarModal("modalProyecto");
                cargarProyectos();
            } else {
                alert("Error al publicar el proyecto");
            }
        });

        function openReportModal(projectId) {
            reportMode = "PROJECT";

            document.getElementById("reportTitle").textContent = "Reportar Proyecto";
            document.getElementById("reportProjectId").value = projectId;

            abrirModal("reportModal");
        }

        function openReportServiceModal(serviceId) {
            reportMode = "SERVICE";

            document.getElementById("reportTitle").textContent = "Reportar Servicio";
            document.getElementById("reportProjectId").value = serviceId;

            abrirModal("reportModal");
        }


        function openRequestModal(serviceId, freelancerId, serviceTitle) {
            if (!user) {
                alert("Debes iniciar sesión");
                return;
            }

            if (user.id === freelancerId) {
                alert("No puedes solicitar tus propios servicios");
                return;
            }

            document.getElementById("requestServiceId").value = serviceId;
            document.getElementById("requestFreelancerId").value = freelancerId;
            document.getElementById("requestServiceTitle").textContent = serviceTitle;
            document.getElementById("requestDescription").value = "";

            abrirModal("modalSolicitud");
        }

        async function sendReport() {
            const type = document.getElementById("reportType").value;
            const text = document.getElementById("reportText").value;
            const reportedId = Number(document.getElementById("reportProjectId").value);

            if (type === "") {
                alert("Seleccioná el tipo de reporte.");
                return;
            }

            if (text.trim() === "") {
                alert("Escribá una descripción.");
                return;
            }

            const report = {
                type: type,
                description: text,
                reportedBy: { id: user.id }
            };

            if (reportMode === "PROJECT") {
                report.reportedProjectId = reportedId;
            }

            if (reportMode === "SERVICE") {
                report.reportedServiceId = reportedId;
            }

            const response = await fetch(API_URL + "/api/reports", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(report)
            });

            if (response.ok) {
                alert("Reporte enviado correctamente.");
                document.getElementById("reportText").value = "";
                document.getElementById("reportType").value = "";
                document.getElementById("reportProjectId").value = "";
                reportMode = "PROJECT";
                cerrarModal("reportModal");
            } else {
                const text = await response.text();
                console.error("Error backend:", text);
                alert(text || "Error al enviar el reporte.");
            }
        }

        async function sendJobRequest() {
            const description = document.getElementById("requestDescription").value;

            if (description.trim() === "") {
                alert("Debe escribir una descripción");
                return;
            }

            const request = {
                description: description,
                client: {
                    id: user.id
                },
                freelancer: {
                    id: Number(document.getElementById("requestFreelancerId").value)
                },
                service: {
                    id: Number(document.getElementById("requestServiceId").value)
                }
            };

            const response = await fetch(API_URL + "/api/jobrequest/save", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(request)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalSolicitud");
                alert("Solicitud enviada correctamente");
            } else {
                alert(text || "Error al enviar solicitud");
            }
        }

        async function confirmarFreelancer() {
            const response = await fetch(API_URL + "/users/" + user.id + "/become-freelancer", {
                method: "PUT"
            });

            if (response.ok) {
                const updatedUser = await response.json();
                localStorage.setItem("user", JSON.stringify(updatedUser));
                alert("¡Ahora eres freelancer!");
                window.location.reload();
            } else {
                alert("Error al cambiar de rol");
            }
        }



        cargarProyectos().then(() => cargarServicios());



        function filtrarFeed() {
            const texto = document.getElementById("searchInput").value.toLowerCase();
            const cards = document.querySelectorAll("#feedContainer .project-card");

            cards.forEach(card => {
                const contenido = card.textContent.toLowerCase();
                card.style.display = contenido.includes(texto) ? "block" : "none";
            });
        }

        document.getElementById("searchInput").addEventListener("input", filtrarFeed);
    </script>
</body>

</html>
