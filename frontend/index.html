<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb - Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="feed-page">
    <nav class="navbar">
    <div class="logo">DevWeb</div>
    <input type="text" class="search-input" placeholder="Buscar freelancers...">
    <div class="user-menu">
        <a href="users/profile.html" id="userName" class="user-link"></a>
       <button onclick="logout()">Cerrar sesión</button>
    </div>
</nav>

<!-- Banner para FREELANCER -->
<div class="post-banner" id="freelancerBanner" style="display:none;">
    <p>¿Qué estás trabajando?</p>
    <button onclick="abrirModal('modalProyecto')">Subir proyecto</button>
</div>

<!-- Banner para CLIENT -->
<div class="post-banner" id="clientBanner" style="display:none;">
    <p>¿Eres freelancer? Únite a DevWeb</p>
    <button onclick="abrirModal('modalFreelancer')">Convertirme en freelancer</button>
</div>

<!-- Modal: Crear proyecto -->
<div class="modal-overlay" id="modalProyecto" style="display:none;">
    <div class="modal-box">
        <h3>Subir nuevo proyecto</h3>
        <form id="formProyecto">
            <input type="text" id="projTitle" placeholder="Título" required>
            <textarea id="projDescription" placeholder="Descripción" required></textarea>
            <select id="projCategory" required>
                <option value="">Categoría</option>
                <option value="WEB_DEVELOPMENT">Desarrollo Web</option>
                <option value="MOBILE_DEVELOPMENT">Desarrollo Móvil</option>
                <option value="GRAPHIC_DESIGN">Diseño Gráfico</option>
                <option value="UI_UX_DESIGN">UI/UX</option>
            </select>
            <input type="url" id="projImage" placeholder="URL de imagen" required>
            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalProyecto')">Cancelar</button>
                <button type="submit">Publicar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Convertirse en freelancer -->
<div class="modal-overlay" id="modalFreelancer" style="display:none;">
    <div class="modal-box">
        <h3>Convertirte en freelancer</h3>
        <p>Al confirmar, tu cuenta podrá publicar servicios y proyectos.</p>
        <div class="modal-buttons">
            <button type="button" onclick="cerrarModal('modalFreelancer')">Cancelar</button>
            <button onclick="confirmarFreelancer()">Confirmar</button>
        </div>
    </div>
</div>

<div class="feed-container" id="feedContainer">
    <!-- Aquí se cargan los proyectos dinámicamente -->
</div>

<script src="js/api.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (!user) {
        window.location.href = "users/login.html";
    }

    document.getElementById("userName").textContent = "Hola, " + user.name;

    async function cargarProyectos() {
        const response = await fetch(API_URL + "/projects");
        const proyectos = await response.json();
        
        const contenedor = document.getElementById("feedContainer");
        contenedor.innerHTML = "";

        proyectos.forEach(proyecto => {
            contenedor.innerHTML += `
                <div class="project-card">
                    <img src="${proyecto.imageUrl}" class="project-image" alt="${proyecto.title}">
                    <div class="project-info">
                        <h3>${proyecto.title}</h3>
                        <p>Por: ${proyecto.freelancerName}</p>
                    </div>
                </div>
            `;
        });
    }

    if (user.role === "FREELANCER") {
        document.getElementById("freelancerBanner").style.display = "flex";
    } else if (user.role === "CLIENT") {
        document.getElementById("clientBanner").style.display = "flex";
    }

    document.getElementById("formProyecto").addEventListener("submit", async function(e) {
        e.preventDefault();

        const proyecto = {
            title: document.getElementById("projTitle").value,
            description: document.getElementById("projDescription").value,
            category: document.getElementById("projCategory").value,
            imageUrl: document.getElementById("projImage").value,
            freelancer: { id: user.id }
        };

        const response = await fetch(API_URL + "/projects", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(proyecto)
        });

        if (response.ok) {
            cerrarModal("modalProyecto");
            cargarProyectos();
        } else {
            alert("Error al publicar el proyecto");
        }
    });

    async function confirmarFreelancer() {
        const response = await fetch(API_URL + "/users/" + user.id + "/become-freelancer", {
            method: "PUT"
        });

        if (response.ok) {
            const updatedUser = await response.json();
            localStorage.setItem("user", JSON.stringify(updatedUser));
            alert("¡Ahora eres freelancer!");
            window.location.reload();
        } else {
            alert("Error al cambiar de rol");
        }
    }

    cargarProyectos();
</script>
</body>
</html>
