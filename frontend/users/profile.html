<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevWeb - Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="feed-page">
    <nav class="navbar">
        <a href="../index.html" class="logo">DevWeb</a>
        <input type="text" class="search-input" placeholder="Buscar freelancers...">
        <div class="user-menu">
            <a href="profile.html" id="userName" class="user-link"></a>
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </nav>

    <div class="profile-container">
        <div class="profile-header">

            <h2 id="profileName"></h2>
            <p id="profileRole"></p>
            <p id="profileEmail"></p>
            <p id="profileRating"></p>

            <div class="profile-btn">
                <button onclick="abrirModal('modalEditar')">Editar perfil</button>

                <a id="btnPerfilPublico" style="display:none;">
                    <button type="button">Ver perfil público</button>
                </a>
                <a id="btnAdmin" style="display:none;">
                    <button type="button">Gestión</button>
                </a>    
            </div>
            
        </div>

        <div id="profileTabs" class="freelancer-tabs" style="display:none;">
            <button id="tabServices" class="tab-active" onclick="showProfileSection('services')">Servicios</button>
            <button id="tabProjects" onclick="showProfileSection('projects')">Proyectos</button>
            <button id="tabRequests" onclick="showProfileSection('requests')">Solicitudes</button>
        </div>

        <div id="projectsSection" style="display:none;">
            <div class="section-header">
                <h3>Mis proyectos</h3>
                <button id="btnAgregarProyecto" style="display:none;" onclick="abrirModal('modalProyecto')">
                    Añadir proyecto
                </button>
            </div>
            <div id="projectsContainer"></div>
        </div>

        <div id="servicesSection" style="display:none;">
            <div class="section-header">
                <h3>Mis servicios</h3>
                <button id="btnAgregarServicio" style="display:none;" onclick="abrirModal('modalServicio')">
                    Añadir servicio
                </button>
            </div>
            <div id="servicesContainer"></div>
        </div>

        <div id="clientSection" style="display:none;">
            <h3 id="solicitudesTitulo">Mis solicitudes</h3>
            <div id="solicitudesContainer"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modalEditar" style="display:none;">
        <div class="modal-box">
            <h3>Editar perfil</h3>

            <form id="formEditar">
                <input type="text" id="editName" placeholder="Nombre" required>

                <div class="modal-buttons">
                    <button type="button" onclick="cerrarModal('modalEditar')">Cancelar</button>
                    <button type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalProyecto" style="display:none;">
        <div class="modal-box">
            <h3>Subir nuevo proyecto</h3>

            <form id="formProyecto">
                <input type="text" id="projTitle" placeholder="Título" required>
                <textarea id="projDescription" placeholder="Descripción" required></textarea>

                <select id="projCategory" required>
                    <option value="">Categoría</option>
                    <option value="PROGRAMMING">PROGRAMMING</option>
                    <option value="WEB_DEVELOPMENT">WEB_DEVELOPMENT</option>
                    <option value="MOBILE_DEVELOPMENT">MOBILE_DEVELOPMENT</option>
                    <option value="GAME_DEVELOPMENT">GAME_DEVELOPMENT</option>
                    <option value="GRAPHIC_DESIGN">GRAPHIC_DESIGN</option>
                    <option value="UI_UX_DESIGN">UI_UX_DESIGN</option>
                    <option value="ILLUSTRATION">ILLUSTRATION</option>
                    <option value="ANIMATION">ANIMATION</option>
                    <option value="VIDEO_EDITING">VIDEO_EDITING</option>
                    <option value="PHOTOGRAPHY">PHOTOGRAPHY</option>
                    <option value="MUSIC_PRODUCTION">MUSIC_PRODUCTION</option>
                </select>

                <input type="url" id="projImage" placeholder="URL de imagen" required>

                <div class="modal-buttons">
                    <button type="button" onclick="cerrarModal('modalProyecto')">Cancelar</button>
                    <button type="submit">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="modalServicio" style="display:none;">
        <div class="modal-box">
            <h3>Publicar servicio</h3>

            <form id="formServicio">
                <input type="text" id="serviceTitle" placeholder="Título" required>
                <textarea id="serviceDescription" placeholder="Descripción" required></textarea>

                <select id="serviceCategory" required>
                    <option value="">Categoría</option>
                    <option value="PROGRAMMING">PROGRAMMING</option>
                    <option value="WEB_DEVELOPMENT">WEB_DEVELOPMENT</option>
                    <option value="MOBILE_DEVELOPMENT">MOBILE_DEVELOPMENT</option>
                    <option value="GAME_DEVELOPMENT">GAME_DEVELOPMENT</option>
                    <option value="GRAPHIC_DESIGN">GRAPHIC_DESIGN</option>
                    <option value="UI_UX_DESIGN">UI_UX_DESIGN</option>
                    <option value="ILLUSTRATION">ILLUSTRATION</option>
                    <option value="ANIMATION">ANIMATION</option>
                    <option value="VIDEO_EDITING">VIDEO_EDITING</option>
                    <option value="PHOTOGRAPHY">PHOTOGRAPHY</option>
                    <option value="MUSIC_PRODUCTION">MUSIC_PRODUCTION</option>
                </select>

                <input type="number" id="servicePrice" placeholder="Precio" required min="1">
                <input type="url" id="serviceImage" placeholder="URL de imagen" required>

                <div class="modal-buttons">
                    <button type="button" onclick="cerrarModal('modalServicio')">Cancelar</button>
                    <button type="submit">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>

    <script>
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
            window.location.href = "login.html";
        }

        document.getElementById("userName").textContent = "Hola, " + user.name;
        document.getElementById("profileName").textContent = user.name;
        document.getElementById("profileRole").textContent = "Rol: " + user.role;
        document.getElementById("profileEmail").textContent = "Email: " + user.email;
        document.getElementById("profileRating").textContent = "Calificación: " + user.rating;
        document.getElementById("editName").value = user.name;

        if (user.role === "FREELANCER") {
            document.getElementById("profileTabs").style.display = "flex";

            document.getElementById("servicesSection").style.display = "block";
            document.getElementById("projectsSection").style.display = "none";
            document.getElementById("clientSection").style.display = "none";

            document.getElementById("btnPerfilPublico").style.display = "inline-block";
            document.getElementById("btnPerfilPublico").href = "../freelancer.html?id=" + user.id;

            document.getElementById("btnAgregarProyecto").style.display = "inline-block";
            document.getElementById("btnAgregarServicio").style.display = "inline-block";

            document.getElementById("solicitudesTitulo").textContent = "Mis solicitudes";

            cargarMisProyectos();
            cargarMisServicios();
            cargarSolicitudesFreelancer();

        } else if (user.role === "CLIENT") {
            document.getElementById("clientSection").style.display = "block";
            document.getElementById("solicitudesTitulo").textContent = "Mis solicitudes enviadas";

            cargarSolicitudesCliente();
        } else if (user.role ==="ADMIN"){
            document.getElementById("btnAdmin").style.display="block";
            document.getElementById("btnAdmin").href="../admin.html";
        }

        function showProfileSection(section) {
            document.getElementById("servicesSection").style.display = "none";
            document.getElementById("projectsSection").style.display = "none";
            document.getElementById("clientSection").style.display = "none";

            document.getElementById("tabServices").classList.remove("tab-active");
            document.getElementById("tabProjects").classList.remove("tab-active");
            document.getElementById("tabRequests").classList.remove("tab-active");

            if (section === "services") {
                document.getElementById("servicesSection").style.display = "block";
                document.getElementById("tabServices").classList.add("tab-active");
            }

            if (section === "projects") {
                document.getElementById("projectsSection").style.display = "block";
                document.getElementById("tabProjects").classList.add("tab-active");
            }

            if (section === "requests") {
                document.getElementById("clientSection").style.display = "block";
                document.getElementById("tabRequests").classList.add("tab-active");
            }
        }

        async function cargarMisProyectos() {
            const response = await fetch(API_URL + "/projects/freelancer/" + user.id);
            const contenedor = document.getElementById("projectsContainer");

            if (!response.ok) {
                contenedor.innerHTML = "<p>No tenés proyectos publicados.</p>";
                return;
            }

            const proyectos = await response.json();
            contenedor.innerHTML = "";

            proyectos.forEach(proyecto => {
                contenedor.innerHTML += `
                <div class="project-card">
                    <img src="${proyecto.imageUrl}" class="project-image" alt="${proyecto.title}">
                    <div class="project-info">
                        <h3>${proyecto.title}</h3>
                    </div>
                </div>
            `;
            });
        }

        async function cargarMisServicios() {
            const response = await fetch(API_URL + "/api/services/findByFreelancer/" + user.id);
            const contenedor = document.getElementById("servicesContainer");

            if (!response.ok) {
                contenedor.innerHTML = "<p>No tenés servicios publicados.</p>";
                return;
            }

            const servicios = await response.json();
            contenedor.innerHTML = "";

            servicios.forEach(service => {
                contenedor.innerHTML += `
                <div class="project-card">
                    <img src="${service.imageUrl}" class="project-image" alt="${service.title}">

                    <div class="project-info">
                        <h3>${service.title}</h3>
                        <p>Categoría: ${service.category}</p>
                        <p>Precio: ₡${Number(service.price).toLocaleString()}</p>
                    </div>
                </div>
            `;
            });
        }

        async function cargarSolicitudesCliente() {
            const response = await fetch(API_URL + "/api/jobrequest/findByClient/" + user.id);
            const contenedor = document.getElementById("solicitudesContainer");

            if (!response.ok) {
                contenedor.innerHTML = "<p>No tenés solicitudes enviadas.</p>";
                return;
            }

            const solicitudes = await response.json();
            contenedor.innerHTML = "";

            solicitudes.forEach(solicitud => {
                contenedor.innerHTML += `
                <div class="project-card">
                    <div class="project-info">
                        <h3>Solicitud #${solicitud.id}</h3>
                        <p>${solicitud.description}</p>
                        <p>Estado: ${solicitud.status}</p>
                        <p>Servicio ID: ${solicitud.serviceId}</p>
                    </div>
                </div>
            `;
            });
        }

        async function cargarSolicitudesFreelancer() {
            const response = await fetch(API_URL + "/api/jobrequest/findByFreelancer/" + user.id);
            const contenedor = document.getElementById("solicitudesContainer");

            if (!response.ok) {
                contenedor.innerHTML = "<p>No tenés solicitudes recibidas.</p>";
                return;
            }

            const solicitudes = await response.json();
            contenedor.innerHTML = "";

            solicitudes.forEach(solicitud => {
                let botones = "";

                if (solicitud.status === "PENDING") {
                    botones = `
                    <div class="card-actions">
                        <button class="btn-accept" onclick="aceptarSolicitud(${solicitud.id})">
                            Aceptar
                        </button>

                        <button class="btn-reject" onclick="rechazarSolicitud(${solicitud.id})">
                            Rechazar
                        </button>
                    </div>
                `;
                }

                if (solicitud.status === "ACCEPTED") {
                    botones = `
                    <div class="card-actions">
                        <button class="btn-complete" onclick="completarSolicitud(${solicitud.id})">
                            Completar
                        </button>
                    </div>
                `;
                }

                contenedor.innerHTML += `
                <div class="project-card">
                    <div class="project-info">
                        <h3>Solicitud #${solicitud.id}</h3>
                        <p>${solicitud.description}</p>
                        <p>Estado: ${solicitud.status}</p>
                        <p>Cliente ID: ${solicitud.clientId}</p>
                        <p>Servicio ID: ${solicitud.serviceId}</p>
                        ${botones}
                    </div>
                </div>
            `;
            });
        }

        async function aceptarSolicitud(id) {
            await fetch(API_URL + "/api/jobrequest/accept/" + id, {
                method: "PUT"
            });

            cargarSolicitudesFreelancer();
        }

        async function rechazarSolicitud(id) {
            await fetch(API_URL + "/api/jobrequest/reject/" + id, {
                method: "PUT"
            });

            cargarSolicitudesFreelancer();
        }

        async function completarSolicitud(id) {
            await fetch(API_URL + "/api/jobrequest/complete/" + id, {
                method: "PUT"
            });

            cargarSolicitudesFreelancer();
        }


        document.getElementById("formServicio").addEventListener("submit", async function (e) {
            e.preventDefault();

            const servicio = {
                title: document.getElementById("serviceTitle").value,
                description: document.getElementById("serviceDescription").value,
                category: document.getElementById("serviceCategory").value,
                price: Number(document.getElementById("servicePrice").value),
                imageUrl: document.getElementById("serviceImage").value,
                freelancer: {
                    id: user.id
                }
            };

            const url = editingServiceId
                ? API_URL + "/api/services/edit/" + editingServiceId
                : API_URL + "/api/services/save";

            const method = editingServiceId ? "PUT" : "POST";

            const response = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(servicio)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalServicio");
                document.getElementById("formServicio").reset();

                editingServiceId = null;

                cargarMisServicios();

                alert(method === "POST" ? "Servicio publicado" : "Servicio actualizado");
            } else {
                alert(text || "Error al guardar servicio");
            }
        });

        document.getElementById("formProyecto").addEventListener("submit", async function (e) {
            e.preventDefault();

            const proyecto = {
                title: document.getElementById("projTitle").value,
                description: document.getElementById("projDescription").value,
                category: document.getElementById("projCategory").value,
                imageUrl: document.getElementById("projImage").value,
                freelancer: {
                    id: user.id
                }
            };

            const response = await fetch(API_URL + "/projects", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(proyecto)
            });

            if (response.ok) {
                cerrarModal("modalProyecto");
                document.getElementById("formProyecto").reset();
                cargarMisProyectos();
                alert("Proyecto publicado");
            } else {
                alert("Error al publicar proyecto");
            }
        });

        document.getElementById("formServicio").addEventListener("submit", async function (e) {
            e.preventDefault();

            const servicio = {
                title: document.getElementById("serviceTitle").value,
                description: document.getElementById("serviceDescription").value,
                category: document.getElementById("serviceCategory").value,
                price: Number(document.getElementById("servicePrice").value),
                imageUrl: document.getElementById("serviceImage").value,
                freelancer: {
                    id: user.id
                }
            };

            const response = await fetch(API_URL + "/api/services/save", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(servicio)
            });

            if (response.ok) {
                cerrarModal("modalServicio");
                document.getElementById("formServicio").reset();
                cargarMisServicios();
                alert("Servicio publicado");
            } else {
                const text = await response.text();
                alert(text || "Error al publicar servicio");
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
