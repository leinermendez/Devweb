<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>DevWeb - Perfil Freelancer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="feed-page public-freelancer-page">

    <nav class="navbar">
        <a href="index.html" class="logo">DevWeb</a>
        

        <div class="user-menu">
            <a href="users/profile.html" id="userName" class="user-link"></a>
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </nav>

    <main class="freelancer-page">

        <aside class="freelancer-profile-card">
            <div class="freelancer-avatar" id="avatarLetter">F</div>

            <h1 id="freelancerName">Cargando...</h1>
            <p id="freelancerEmail" class="profile-muted"></p>

            <div class="profile-badges">
                <span id="ratingBadge">⭐ 0</span>
                <span id="verifiedBadge">Sin verificar</span>
            </div>

            <button class="secondary-profile-button" onclick="toggleReport()">
                Reportar usuario
            </button>

            <div id="reportBox" class="report-box" style="display:none;">
                <h4>Reportar usuario</h4>

                <select id="userReportType">
                    <option value="">Seleccione un motivo</option>
                    <option value="SPAM">Spam</option>
                    <option value="SCAM_OR_FRAUD">Estafa</option>
                    <option value="INAPPROPRIATE_CONTENT">Contenido inapropiado</option>
                    <option value="MISLEADING_INFORMATION">Información engañosa</option>
                    <option value="OTHER">Otro</option>
                </select>

                <textarea id="reportText" placeholder="Motivo del reporte"></textarea>
                <button onclick="sendReport()">Enviar reporte</button>
            </div>
        </aside>

        <section class="freelancer-main-content">

            <div class="freelancer-tabs">
                <button id="servicesTabBtn" class="tab-active" onclick="showSection('services')">Servicios</button>
                <button id="projectsTabBtn" onclick="showSection('projects')">Proyectos</button>
                <button id="reviewsTabBtn" onclick="showSection('reviews')">Reviews</button>
            </div>

            <section id="servicesSection" class="freelancer-section">
                <h2>Servicios</h2>
                <div id="servicesContainer"></div>
            </section>

            <section id="projectsSection" class="freelancer-section" style="display:none;">
                <h2>Proyectos</h2>
                <div id="projectsContainer" class="projects-public-grid"></div>
            </section>

            <section id="reviewsSection" class="freelancer-section" style="display:none;">
                <div class="section-title-row">
                    <div>
                        <h2>Reviews</h2>
                        <p id="reviewsAverage" class="profile-muted"></p>
                    </div>

                    <button id="reviewButton" class="small-button" onclick="openReviewModal()" style="display:none;">
                        Agregar review
                    </button>
                </div>

                <div id="reviewsContainer"></div>
            </section>

        </section>

    </main>

    <div class="modal-overlay" id="modalSolicitud" style="display:none;">
        <div class="modal-box">
            <h3>Solicitar servicio</h3>

            <p id="requestServiceTitle" class="profile-muted"></p>

            <input type="hidden" id="requestServiceId">

            <textarea id="requestDescription" placeholder="Describe el trabajo que necesitás"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalSolicitud')">Cancelar</button>
                <button type="button" onclick="sendJobRequest()">Enviar solicitud</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalReview" style="display:none;">
        <div class="modal-box">
            <h3>Agregar review</h3>

            <select id="reviewRating">
                <option value="5">5 estrellas</option>
                <option value="4">4 estrellas</option>
                <option value="3">3 estrellas</option>
                <option value="2">2 estrellas</option>
                <option value="1">1 estrella</option>
            </select>

            <textarea id="reviewComment" placeholder="Comentario"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalReview')">Cancelar</button>
                <button type="button" onclick="sendReview()">Publicar review</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalServiceReport" style="display:none;">
        <div class="modal-box">
            <h3>Reportar servicio</h3>

            <input type="hidden" id="reportedServiceId">

            <select id="serviceReportType">
                <option value="">Seleccione un motivo</option>
                <option value="SPAM">Spam</option>
                <option value="SCAM_OR_FRAUD">Estafa</option>
                <option value="INAPPROPRIATE_CONTENT">Contenido inapropiado</option>
                <option value="MISLEADING_INFORMATION">Información engañosa</option>
                <option value="OTHER">Otro</option>
            </select>

            <textarea id="serviceReportText" placeholder="Descripción"></textarea>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal('modalServiceReport')">Cancelar</button>
                <button type="button" onclick="sendServiceReport()">Enviar</button>
            </div>
        </div>
    </div>


    <div class="modal-overlay" id="modalProjectReport" style="display:none;">
        <div class="modal-box">
            <h3>Reportar proyecto</h3>

            <input type="hidden" id="reportProjectId">

            <select id="projectReportType">
                <option value="">Seleccione un motivo</option>
                <option value="SPAM">Spam</option>
                <option value="SCAM_OR_FRAUD">Estafa</option>
                <option value="INAPPROPRIATE_CONTENT">Contenido inapropiado</option>
                <option value="MISLEADING_INFORMATION">Información engañosa</option>
                <option value="OTHER">Otro</option>
            </select>

            <textarea id="projectReportText"></textarea>

            <div class="modal-buttons">
                <button onclick="cerrarModal('modalProjectReport')">
                    Cancelar
                </button>

                <button onclick="sendProjectReport()">
                    Reportar
                </button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>

    <script>
        const loggedUser = JSON.parse(localStorage.getItem("user"));
        const params = new URLSearchParams(window.location.search);
        const freelancerId = params.get("id");

        if (!freelancerId) {
            alert("No se indicó el freelancer.");
            window.location.href = "index.html";
        }

        if (loggedUser) {
            document.getElementById("userName").textContent = "Hola, " + loggedUser.name;

            if (loggedUser.role === "CLIENT") {
                document.getElementById("reviewButton").style.display = "inline-block";
            }

        } else {
            document.getElementById("userName").textContent = "Iniciar sesión";
            document.getElementById("userName").href = "users/login.html";
        }

        window.addEventListener("DOMContentLoaded", function () {
            loadFreelancer();
            loadServices();
            loadProjects();
            loadReviews();
        });

        async function loadFreelancer() {
            const response = await fetch(API_URL + "/users/" + freelancerId);

            if (!response.ok) {
                alert("No se pudo cargar el freelancer.");
                return;
            }

            const freelancer = await response.json();

            document.getElementById("freelancerName").textContent = freelancer.name;
            document.getElementById("freelancerEmail").textContent = freelancer.email;
            document.getElementById("ratingBadge").textContent = "⭐ " + (freelancer.rating ?? 0);
            document.getElementById("verifiedBadge").textContent = freelancer.verified ? "✔ Verificado" : "Sin verificar";

            if (freelancer.name) {
                document.getElementById("avatarLetter").textContent = freelancer.name.charAt(0).toUpperCase();
            }
        }

        async function loadServices() {
            const container = document.getElementById("servicesContainer");
            container.innerHTML = "<p class='profile-muted'>Cargando servicios...</p>";

            const response = await fetch(API_URL + "/api/services/findByFreelancer/" + freelancerId);

            if (!response.ok) {
                container.innerHTML = "<p class='profile-muted'>Este freelancer no tiene servicios publicados.</p>";
                return;
            }

            const services = await response.json();
            container.innerHTML = "";

            services.forEach(function (service) {
                const serviceImage = service.imageUrl
                    ? `<img src="${service.imageUrl}" class="service-image" alt="${service.title}">`
                    : `<div class="service-slot-category">${service.category}</div>`;

                container.innerHTML += `
                <article class="service-slot-card">
                    ${serviceImage}

                    <div class="service-slot-info">
                        <h3>${service.title}</h3>
                        <p>Categoría: ${service.category}</p>
                        <p>${service.description || ""}</p>
                        <p>Freelancer: ${service.freelancerName}</p>
                        <p class="service-slot-price">₡${Number(service.price).toLocaleString()}</p>

                        <button class="btn-service" onclick="openRequestModal(${service.id}, '${service.title.replace(/'/g, "\\'")}')">
                             Solicitar servicio
                        </button>

                        <button class="btn-report" onclick="openServiceReportModal(${service.id})">
                           Reportar servicio
                        </button>

                    </div>
                </article>
            `;
            });
        }

        async function loadProjects() {
            const container = document.getElementById("projectsContainer");
            container.innerHTML = "<p class='profile-muted'>Cargando proyectos...</p>";

            const response = await fetch(API_URL + "/projects/freelancer/" + freelancerId);

            if (!response.ok) {
                container.innerHTML = "<p class='profile-muted'>Este freelancer no tiene proyectos publicados.</p>";
                return;
            }

            const projects = await response.json();
            container.innerHTML = "";

            projects.forEach(function (project) {
                container.innerHTML += `
                <article class="project-public-card">
                    <img src="${project.imageUrl}" alt="${project.title}">
<div>
    <h3>${project.title}</h3>

    <p>${project.description || ""}</p>

    <p>Categoría: ${project.category || ""}</p>

    <p>Por ${project.freelancerName}</p>

    <div class="card-actions">
        <button class="btn-report"
            onclick="openProjectReportModal(${project.id})">
            Reportar proyecto
        </button>
    </div>
</div>
                </article>
            `;
            });
        }

        async function loadReviews() {
            const container = document.getElementById("reviewsContainer");
            const average = document.getElementById("reviewsAverage");

            container.innerHTML = "<p class='profile-muted'>Cargando reviews...</p>";

            const response = await fetch(API_URL + "/review/freelancer/" + freelancerId);
            const data = await response.json();

            if (typeof data === "string") {
                average.textContent = "Promedio: sin reviews";
                container.innerHTML = "<p class='profile-muted'>Este freelancer todavía no tiene reviews.</p>";
                return;
            }

            average.textContent = "Promedio: ⭐ " + data.Average;
            container.innerHTML = "";

            data.Reviews.forEach(function (review) {
                container.innerHTML += `
                <article class="review-slot-card">
                    <div class="review-row">
                        <strong>${review.clientName}</strong>
                        <span>⭐ ${review.rating}</span>
                    </div>

                    <p>${review.comment}</p>
                    <small>${formatDate(review.date)}</small>
                </article>
            `;
            });
        }

        function openRequestModal(serviceId, serviceTitle) {
            if (!loggedUser) {
                alert("Debes iniciar sesión.");
                return;
            }

            if (loggedUser.id === freelancerId) {
                alert("No puedes solicitar tus propios servicios.");
                return;
            }

            document.getElementById("requestServiceId").value = serviceId;
            document.getElementById("requestServiceTitle").textContent = serviceTitle;
            document.getElementById("requestDescription").value = "";

            abrirModal("modalSolicitud");
        }

        async function sendJobRequest() {
            const serviceId = document.getElementById("requestServiceId").value;
            const description = document.getElementById("requestDescription").value;

            if (description.trim() === "") {
                alert("Debe escribir una descripción.");
                return;
            }

            const request = {
                description: description,
                client: {
                    id: loggedUser.id
                },
                freelancer: {
                    id: Number(freelancerId)
                },
                service: {
                    id: Number(serviceId)
                }
            };

            const response = await fetch(API_URL + "/api/jobrequest/save", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(request)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalSolicitud");
                alert("Solicitud enviada correctamente.");
            } else {
                alert(text);
            }
        }

        function openReviewModal() {
            if (!loggedUser) {
                alert("Debes iniciar sesión.");
                return;
            }

            if (loggedUser.id === freelancerId) {
                alert("No puedes dejar una review en tu propio perfil.");
                return;
            }

            document.getElementById("reviewRating").value = "5";
            document.getElementById("reviewComment").value = "";
            abrirModal("modalReview");
        }

        async function sendReview() {
            const rating = Number(document.getElementById("reviewRating").value);
            const comment = document.getElementById("reviewComment").value;

            if (comment.trim() === "") {
                alert("Debe escribir un comentario.");
                return;
            }

            const review = {
                comment: comment,
                rating: rating,
                client: {
                    id: loggedUser.id
                },
                freelancer: {
                    id: Number(freelancerId)
                }
            };

            const response = await fetch(API_URL + "/review", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(review)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalReview");
                alert("Review publicada.");
                loadReviews();
            } else {
                alert(text);
            }
        }

        function showSection(section) {
            document.getElementById("servicesSection").style.display = "none";
            document.getElementById("projectsSection").style.display = "none";
            document.getElementById("reviewsSection").style.display = "none";

            document.getElementById("servicesTabBtn").classList.remove("tab-active");
            document.getElementById("projectsTabBtn").classList.remove("tab-active");
            document.getElementById("reviewsTabBtn").classList.remove("tab-active");

            if (section === "services") {
                document.getElementById("servicesSection").style.display = "block";
                document.getElementById("servicesTabBtn").classList.add("tab-active");
            }

            if (section === "projects") {
                document.getElementById("projectsSection").style.display = "block";
                document.getElementById("projectsTabBtn").classList.add("tab-active");
            }

            if (section === "reviews") {
                document.getElementById("reviewsSection").style.display = "block";
                document.getElementById("reviewsTabBtn").classList.add("tab-active");
            }
        }

        function openServiceReportModal(serviceId) {

            document.getElementById("reportedServiceId").value = serviceId;
            document.getElementById("serviceReportType").value = "";
            document.getElementById("serviceReportText").value = "";

            abrirModal("modalServiceReport");
        }

        function openProjectReportModal(projectId) {
            document.getElementById("reportProjectId").value = projectId;
            document.getElementById("projectReportType").value = "";
            document.getElementById("projectReportText").value = "";

            abrirModal("modalProjectReport");
        }

        function toggleReport() {
            const box = document.getElementById("reportBox");
            box.style.display = box.style.display === "none" ? "block" : "none";
        }

        async function sendReport() {

            const type = document.getElementById("userReportType").value;
            const text = document.getElementById("reportText").value;

            if (type === "") {
                alert("Seleccione un motivo.");
                return;
            }

            if (text.trim() === "") {
                alert("Escriba una descripción.");
                return;
            }

            const report = {
                type: type,
                description: text,
                reportedBy: {
                    id: loggedUser.id
                },
                reportedUser: {
                    id: Number(freelancerId)
                }
            };

            const response = await fetch(API_URL + "/api/reports", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(report)
            });

            const responseText = await response.text();

            if (response.ok) {

                document.getElementById("reportText").value = "";
                document.getElementById("userReportType").value = "";

                toggleReport();

                alert("Reporte enviado correctamente.");

            } else {

                alert(responseText);

            }
        }

        async function sendServiceReport() {

            const report = {
                type: document.getElementById("serviceReportType").value,
                description: document.getElementById("serviceReportText").value,
                reportedBy: {
                    id: loggedUser.id
                },
                reportedServiceId: Number(document.getElementById("reportedServiceId").value)
            };

            const response = await fetch(API_URL + "/api/reports", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(report)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalServiceReport");
                alert("Reporte enviado correctamente.");
            } else {
                alert(text);
            }
        }

        async function sendProjectReport() {

            const report = {
                type: document.getElementById("projectReportType").value,
                description: document.getElementById("projectReportText").value,
                reportedBy: {
                    id: loggedUser.id
                },
                reportedProjectId: Number(document.getElementById("reportProjectId").value)
            };

            const response = await fetch(API_URL + "/api/reports", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(report)
            });

            const text = await response.text();

            if (response.ok) {
                cerrarModal("modalProjectReport");
                alert("Reporte enviado correctamente.");
            } else {
                alert(text);
            }
        }


        function formatDate(dateText) {
            if (!dateText) {
                return "";
            }

            return new Date(dateText).toLocaleDateString("es-CR");
        }
    </script>

</body>

</html>
