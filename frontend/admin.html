<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - DevWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="feed-page public-freelancer-page">

    <nav class="navbar">
        <a href="index.html" class="logo">DevWeb</a>
        <div class="user-menu">
            <span id="userName" class="user-link"></span>
            <button onclick="logout()">Cerrar sesión</button>
        </div>
    </nav>

    <main class="container mt-4 ">
        <div class="freelancer-tabs">
            <button id="tabVerificaciones" class="tab-active" onclick="showSection('verificaciones')">Verificaciones</button>
            <button id="tabReportes" onclick="showSection('reportes')">Reportes</button>
        </div>

        
        <section id="sectionVerifications" >
            <h2 style="color: #fff;">Solicitudes de verificación</h2>
            <div id="verificationsContainer"></div>
        </section>

        
        <section id="sectionReports" style="display:none;">
            <h2 style="color: #fff;">Reportes pendientes</h2>
            <div id="reportsContainer"></div>
        </section>
    </main>


    <script src="js/api.js"></script>
    <script>
        const loggedUser = JSON.parse(localStorage.getItem("user"));
        

        if (!loggedUser || loggedUser.role !== "ADMIN") {
            window.location.href = "index.html";
        }
        document.getElementById("userName").textContent = "Hola, " + loggedUser.name;
        
        async function loadVerification() {
            const container = document.getElementById("verificationsContainer");
            container.innerHTML = "<p class='profile-muted'>Cargando verificaciones...</p>";


            const response = await fetch(API_URL + "/verification");

            const verifications = await response.json();
            container.innerHTML = "";

            verifications.forEach(function (verification) {
                container.innerHTML += `
                    <article class="review-slot-card">
                        <div class="review-row">
                            <strong>${verification.userName}</strong>
                        </div>
                        <p><a href="${verification.evidenceUrl}" target="_blank">Ver evidencia</a></p>
                        <small>${verification.requestDate}</small>
                        <div class="card-actions">
                            <button class="btn-accept" onclick="approvedVerification(${verification.id})">Aprobar</button>
                            <button class="btn-reject" onclick="rejectedVerification(${verification.id})">Rechazar</button>
                        </div>
                    </article>
                `;
            });


        }

        async function loadReports() {
            const container = document.getElementById("reportsContainer");
            container.innerHTML = "<p class='profile-muted'>Cargando reportes...</p>";


            const response = await fetch(API_URL + "/api/reports");

            const reports = await response.json();
            container.innerHTML = "";

            reports.forEach(function (report) {
                container.innerHTML += `
                    <article class="review-slot-card">
                        <div class="review-row">
                            <strong>Reportado por: ${report.reportedBy.name}</strong>
                            <small>${new Date(report.createdAt).toLocaleDateString("es-CR")}</small>
                        </div>

                        <p><strong>Reportado:</strong> 
                            ${report.reportedUser ? report.reportedUser.name : "Proyecto ID: " + report.reportedProjectId}
                        </p>

                        <p><strong>Motivo:</strong> ${report.type}</p>
                        <p>${report.description}</p>

                        <div class="card-actions">
                            <button class="btn-accept" onclick="resolverReporte(${report.id})">Resolver</button>
                            <button class="btn-reject" onclick="rejectedReport(${report.id})">Descartar</button>
                        </div>
                    </article>
                `;
            });

        }

        async function rejectedVerification(id) {
            const response = await fetch(API_URL + "/verification/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "REJECTED" })
            });
            if (response.ok) {
                alert("Verificación rechasada.");
                loadVerification();
            } else {
                alert("Error al aprobar.");
            }
        }  
        async function approvedVerification(id) {
            const response = await fetch(API_URL + "/verification/" + id, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status: "APPROVED" })
            });
            if (response.ok) {
                alert("Verificación aprobada.");
                loadVerification();
            } else {
                alert("Error al aprobar.");
            }
        }      



        async function approvedReport(id) {
                const response = await fetch(API_URL + "/api/reports/" + id + "/resolve", {
                method: "PUT"
            });

            if (response.ok) {
                alert("reporte resuelto.");
                loadReports();
            } else {
            alert("Error al asignarle el estado.");
            }
        }

        async function rejectedReport(id) {
                const response = await fetch(API_URL + "/api/reports/" + id + "/dismiss", {
                method: "PUT"
            });

            if (response.ok) {
                alert("reporte denegado.");
                loadReports();
            } else {
            alert("Error al asignarle el estado.");
            }
        }

        function showSection(seccion) {
            document.getElementById("sectionVerifications").style.display = "none";
            document.getElementById("sectionReports").style.display = "none";
            document.getElementById("tabVerificaciones").classList.remove("tab-active");
            document.getElementById("tabReportes").classList.remove("tab-active");

            if (seccion === "verificaciones") {
                document.getElementById("sectionVerifications").style.display = "block";
                document.getElementById("tabVerificaciones").classList.add("tab-active");
            } else {
                document.getElementById("sectionReports").style.display = "block";
                document.getElementById("tabReportes").classList.add("tab-active");
            }
        }

        
        loadVerification();
        loadReports()
    </script>
</body>
</html>
